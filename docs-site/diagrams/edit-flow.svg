<rect class="b" x="14" y="40" width="130" height="86" rx="12"/><text class="k" x="28" y="62">1</text><text class="t" x="28" y="84">Caller</text><text class="s" x="28" y="104">AI (MCP) or UI</text>
<rect class="b" x="176" y="40" width="140" height="86" rx="12"/><text class="k" x="190" y="62">2</text><text class="t" x="190" y="84">Tool registry</text><text class="s" x="190" y="104">zod validates args</text>
<rect class="h" x="348" y="40" width="150" height="86" rx="12"/><text class="k" x="362" y="62">3</text><text class="t" x="362" y="84">Shared op</text><text class="s" x="362" y="104">pure fn edits a draft</text>
<rect class="b" x="530" y="40" width="160" height="86" rx="12"/><text class="k" x="544" y="62">4</text><text class="t" x="544" y="84">Store.mutate</text><text class="s" x="544" y="104">undo · rev · save</text>
<rect class="b" x="722" y="40" width="184" height="86" rx="12"/><text class="k" x="736" y="62">5</text><text class="t" x="736" y="84">Broadcast</text><text class="s" x="736" y="104">WebSocket, ≤ ~12/s</text>
